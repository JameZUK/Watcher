<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font: 13px system-ui, sans-serif; margin: 0; padding: 14px;
           background: #0b0d16; color: #e2e8f0; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display:block; font-size: 11px; color:#94a3b8; margin: 8px 0 3px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 8px;
            border: 1px solid #1e293b; background: #111827; color: #e2e8f0; }
    button { width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: 8px;
             background: linear-gradient(100deg,#6366f1,#a855f7); color: #fff; font-weight: 600;
             cursor: pointer; }
    .muted { color:#64748b; font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Watch this page</h1>
  <label for="base">Your Watcher URL</label>
  <input id="base" type="url" placeholder="http://localhost:8000">
  <button id="go">Set up monitor →</button>
  <p class="muted">Opens the new-monitor form pre-filled with this tab's URL.</p>
  <script src="popup.js"></script>
</body>
</html>
