<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0813" />
      <stop offset="100%" stop-color="#16102b" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#9d00ff" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="500" height="500" rx="30" fill="url(#bgGrad)" />

  <!-- Retro Cyber Grid -->
  <g opacity="0.1">
    <path d="M 50 360 L 450 360 M 50 390 L 450 390 M 50 420 L 450 420" stroke="#00ffff" stroke-width="2" />
    <path d="M 120 330 L 60 460 M 185 330 L 155 460 M 250 330 L 250 460 M 315 330 L 345 460 M 380 330 L 440 460" stroke="#00ffff" stroke-width="2" />
  </g>

  <!-- Mascot Group -->
  <g transform="translate(0, -15)">
    <!-- Radiating Background Aura -->
    <circle cx="250" cy="220" r="130" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-dasharray="6 12" opacity="0.4" />
    <circle cx="250" cy="220" r="150" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.2" />

    <!-- Robot Antenna -->
    <line x1="250" y1="120" x2="250" y2="70" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="250" cy="65" r="10" fill="#ff007f" filter="url(#neonGlow)" />

    <!-- Funky Brows -->
    <rect x="140" y="90" width="45" height="12" rx="6" fill="#ff007f" transform="rotate(-12, 140, 90)" />
    <rect x="315" y="90" width="45" height="12" rx="6" fill="#00ffff" transform="rotate(12, 360, 90)" />

    <!-- Outer TV/Monitor Frame -->
    <rect x="110" y="120" width="280" height="200" rx="60" fill="#120e24" stroke="url(#neonGrad)" stroke-width="10" filter="url(#neonGlow)" />

    <!-- Inner Screen/Sclera -->
    <rect x="125" y="135" width="250" height="170" rx="45" fill="#ffffff" />

    <!-- Iris -->
    <circle cx="250" cy="220" r="60" fill="url(#irisGrad)" />
    <circle cx="250" cy="220" r="45" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />

    <!-- Pupil -->
    <circle cx="250" cy="220" r="28" fill="#0b0813" />

    <!-- Eye Highlights -->
    <circle cx="268" cy="202" r="9" fill="#ffffff" />
    <circle cx="234" cy="236" r="4" fill="#ffffff" />
  </g>

  <!-- Anaglyph Glitch Typography -->
  <g transform="translate(0, 5)">
    <text x="253" y="443" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="10" fill="#ff007f" opacity="0.7">WATCHER</text>
    <text x="247" y="439" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="10" fill="#00ffff" opacity="0.7">WATCHER</text>
    <text x="250" y="441" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="10" fill="#ffffff">WATCHER</text>
  </g>

  <!-- Accent sparkles -->
  <path d="M 80 100 L 85 110 L 95 115 L 85 120 L 80 130 L 75 120 L 65 115 L 75 110 Z" fill="#00ffff" opacity="0.6"/>
  <path d="M 420 180 L 423 185 L 430 188 L 423 191 L 420 196 L 417 191 L 410 188 L 417 185 Z" fill="#ff007f" opacity="0.6"/>
</svg>
