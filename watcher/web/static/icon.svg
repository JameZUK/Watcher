<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0813" />
      <stop offset="100%" stop-color="#16102b" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#9d00ff" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>
    <linearGradient id="iris" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="110" fill="url(#bg)" />

  <g transform="translate(0, 42)">
    <!-- Antenna -->
    <line x1="250" y1="120" x2="250" y2="70" stroke="url(#neon)" stroke-width="7" stroke-linecap="round" />
    <circle cx="250" cy="63" r="11" fill="#ff007f" filter="url(#glow)" />

    <!-- Funky brows -->
    <rect x="140" y="90" width="45" height="13" rx="6" fill="#ff007f" transform="rotate(-12, 140, 90)" />
    <rect x="315" y="90" width="45" height="13" rx="6" fill="#00ffff" transform="rotate(12, 360, 90)" />

    <!-- Monitor frame -->
    <rect x="105" y="120" width="290" height="205" rx="62" fill="#120e24" stroke="url(#neon)" stroke-width="11" filter="url(#glow)" />

    <!-- Screen -->
    <rect x="121" y="136" width="258" height="173" rx="46" fill="#ffffff" />

    <!-- Iris / pupil -->
    <circle cx="250" cy="222" r="62" fill="url(#iris)" />
    <circle cx="250" cy="222" r="46" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />
    <circle cx="250" cy="222" r="29" fill="#0b0813" />
    <circle cx="269" cy="203" r="9" fill="#ffffff" />
    <circle cx="235" cy="238" r="4" fill="#ffffff" />
  </g>
</svg>
