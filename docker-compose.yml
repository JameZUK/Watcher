services:
  watcher:
    build: .
    image: watcher:latest
    ports:
      # Bound to all interfaces for remote access on a trusted network. There is
      # NO TLS here — for anything internet-facing, put a TLS-terminating reverse
      # proxy (Caddy/nginx/Traefik) in front and bind this back to "127.0.0.1:8000:8000".
      - "0.0.0.0:8000:8000"
    # Secrets (WATCHER_SECRET_KEY, WATCHER_ENCRYPTION_KEY, …) are read from .env
    # by Compose on the HOST — so the same keys carry over and stored encrypted
    # credentials stay decryptable. .env's WATCHER_DATA_DIR is a host path; the
    # override below points the app at the mounted /data instead.
    #
    # First-time setup: create .env with at least
    #   WATCHER_SECRET_KEY=...   (python -c "import secrets;print(secrets.token_urlsafe(48))")
    #   WATCHER_ENCRYPTION_KEY=. (python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())")
    env_file:
      - .env
    environment:
      WATCHER_DATA_DIR: "/data"
      # Set true once this is fronted with HTTPS (Secure cookie + HSTS).
      WATCHER_SECURE_COOKIES: "false"
    volumes:
      # Live database + screenshot blobs, bind-mounted so existing monitors,
      # sessions and history carry over. The image runs as uid 1001 (pwuser), so
      # make the dir writable for it once:  chmod -R a+rwX data
      - ./data:/data
    restart: unless-stopped
    # Chromium needs a larger shared memory segment for stability.
    shm_size: "1gb"
